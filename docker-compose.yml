x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  FRONTEND_URL: ${FRONTEND_URL}
  ENVIRONMENT: production

x-api-depends-on: &api-depends-on
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pulsewatch_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pulsewatch_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *api-env
    depends_on:
      <<: *api-depends-on

  consumer:
    build: ./api
    restart: unless-stopped
    command: python -m consumer
    environment:
      <<: *api-env
    depends_on:
      <<: *api-depends-on

  celery_worker:
    build: ./api
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      <<: *api-env
    depends_on:
      <<: *api-depends-on

  worker_scheduler:
    build: ./worker
    restart: unless-stopped
    command: python scheduler_main.py
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker_sync:
    build: ./worker
    restart: unless-stopped
    command: python sync_main.py
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "5173:80"

volumes:
  pulsewatch_db_data:
  pulsewatch_redis_data:
