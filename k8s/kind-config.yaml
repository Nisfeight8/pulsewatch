kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000
        hostPort: 8000    # api
        protocol: TCP
      - containerPort: 30025
        hostPort: 8025    # mailpit web UI
        protocol: TCP
      - containerPort: 30173
        hostPort: 5173    # frontend
        protocol: TCP