apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-sync
  labels:
    app: worker-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-sync
  template:
    metadata:
      labels:
        app: worker-sync
    spec:
      containers:
        - name: worker-sync
          image: pulsewatch-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "sync_main.py"]
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
